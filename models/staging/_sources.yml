version: 2

sources:
  - name: ibm_hr
    description: >
      IBM HR Analytics Employee Attrition sample dataset (1,470 employees), downloaded from
      IBM's public GitHub repo. IBM built this as fictional sample data for teaching.
    meta:
      external_location: "data/raw/{name}.csv"
    tables:
      - name: ibm_hr_attrition
        description: One row per employee, with attrition flag and HR attributes.
        columns:
          - name: EmployeeNumber
            data_tests: [unique, not_null]
          - name: Attrition
            data_tests:
              - accepted_values:
                  arguments:
                    values: ["Yes", "No"]
          - name: Department
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ["Research & Development", "Sales", "Human Resources"]

  - name: recruiting
    description: >
      SYNTHETIC recruiting funnel generated by scripts/generate_recruiting_funnel.py.
      Real candidate-level data is private, so this is seeded sample data with a few
      known data problems planted on purpose for the data-quality models to catch.
    meta:
      external_location: "data/raw/recruiting_{name}.csv"
    tables:
      - name: requisitions
        columns:
          - name: requisition_id
            data_tests: [unique, not_null]
      - name: applications
        columns:
          - name: application_id
            data_tests: [unique, not_null]
          - name: requisition_id
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('recruiting', 'requisitions')
                    field: requisition_id
      - name: stage_events
        columns:
          - name: event_id
            data_tests: [unique, not_null]
          - name: stage
            data_tests:
              - accepted_values:
                  arguments:
                    values: ["applied", "recruiter_screen", "hiring_manager_interview", "values_fit_interview", "offer", "hired"]
      - name: offers
        columns:
          - name: offer_id
            data_tests: [unique, not_null]
          - name: status
            data_tests:
              - accepted_values:
                  arguments:
                    values: ["accepted", "declined"]
